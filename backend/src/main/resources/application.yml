server:
  port: 8090
  compression:
    # 响应 gzip:档案全量接口(商品 3850行×75列 ≈2.4MB JSON)压到 ~300KB,
    # 生产跨机部署时显著缩短"点进页面转圈"的网络段
    enabled: true
    mime-types: application/json,text/javascript,text/css
    min-response-size: 2KB

spring:
  application:
    name: yinjia-mes-backend
  servlet:
    multipart:
      # 20MB:附件上传上限(产品信息表·客户图纸或规格书等附件字段);OCR 图片另有 10MB 服务端校验
      max-file-size: 20MB
      max-request-size: 21MB
      file-size-threshold: 10MB
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=HSDZ_MES;encrypt=false;trustServerCertificate=true;loginTimeout=10
    username: yinjia
    password: Yinjia@2026
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 15000

yinjia:
  # 登录工厂清单显示名(ADR-0003:YJ=正式 HSDZ_MES / YJ_TEST=测试 HSDZ_MES_TEST)
  factory-name: "YINJIA-MES"
  test-factory-name: "YINJIA-MES·测试库"
  # 本服务器是否提供"测试账套"(2026-09-22b):
  #   开发机(true)= 登录页与顶栏都有两个账套;
  #   服务器(false)= 只出现正式账套 —— 生产服务器上并没有 HSDZ_MES_TEST,
  #     菜单挂着"点了就报连不上库"的选项纯属坑人。服务器打开方式(任选其一,重启生效):
  #       · 启动参数:java -jar app.jar --yinjia.enable-test-ledger=false
  #       · 环境变量:set YINJIA_ENABLETESTLEDGER=false   (Spring 宽松绑定,大小写/连字符不敏感)
  enable-test-ledger: true
  test-datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=HSDZ_MES_TEST;encrypt=false;trustServerCertificate=true;loginTimeout=10
    username: yinjia
    password: Yinjia@2026
  jwt:
    # 生产环境必须通过环境变量 YINJIA_JWT_SECRET 注入随机值
    secret: ${YINJIA_JWT_SECRET:CHANGE_ME_YINJIA_RANDOM_HEX_64_A1B2C3D4E5F60718293A4B5C6D7E8F90}
    expire-hours: 24
  ocr:
    # 阿里云 OCR(扫描填单);未配置密钥时接口明确报"OCR 服务未配置"
    access-key-id: "${ALIBABA_CLOUD_ACCESS_KEY_ID:}"
    access-key-secret: "${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}"
    endpoint: "${ALIBABA_CLOUD_OCR_ENDPOINT:ocr-api.cn-hangzhou.aliyuncs.com}"
    connect-timeout-ms: "${ALIBABA_CLOUD_OCR_CONNECT_TIMEOUT_MS:5000}"
    read-timeout-ms: "${ALIBABA_CLOUD_OCR_READ_TIMEOUT_MS:35000}"
    requests-per-minute: "${ALIBABA_CLOUD_OCR_REQUESTS_PER_MINUTE:10}"
    max-concurrent: "${ALIBABA_CLOUD_OCR_MAX_CONCURRENT:4}"
  attachment:
    # 单据头字段附件(yj_attachment):文件本体存此目录(相对=后端工作目录),元数据入库
    dir: "${YINJIA_ATTACHMENT_DIR:uploads/attachments}"
    max-size-mb: "${YINJIA_ATTACHMENT_MAX_MB:20}"
