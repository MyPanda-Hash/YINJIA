# ============================================================================
# 报表模板注册表(IT 维护)  —— 业务在面板上「导出报表」时能选的模板就是这里的行
# ----------------------------------------------------------------------------
# 一行三键,<模板编码> 自己起(小写字母/下划线,作为接口的 code 参数):
#   <code>.panelCode = 面板编码(必须是 yj_panel.panel_code,取数走该面板的既有查询链路)
#   <code>.name      = 报表名(前端下拉里显示给业务看的名字)
#   <code>.file      = 模板文件(classpath 路径,放 backend/src/main/resources/reports/ 下即可)
#
# 新增一张单据的报表(第二期铺开的做法):
#   1) 拷一份 reports/so_order.jrxml 改成新单的字段,放同目录;
#   2) 在下面加三行;
#   3) 重启后端 —— 前端不用改(入口按「该面板有没有模板」自动显隐)。
# 模板里的字段/参数中文名必须与 yj_field.label 一致,否则取不到值(取数见 ReportService)。
# ============================================================================

so_order.panelCode=SO_ORDER
so_order.name=销售订单
so_order.file=reports/so_order.jrxml

sl_recv.panelCode=SL_RECV
sl_recv.name=送料暂收单
sl_recv.file=reports/sl_recv.jrxml

# 出厂检验报告(2026-10-12):按公司受控表单 c-95-12(表单编号 YJ-QR-05/A1)做的版式,
# 首次挂在销售出库单上。取数口径见 ReportService.headParams + detailRows。
prod_insp.panelCode=SALE_OUT
prod_insp.name=出厂检验报告
prod_insp.file=reports/prod_insp.jrxml

# 出货检验记录表(原「制程检验记录表」,2026-11-08 随面板改名;2026-10-12 建,2026-10-17 **整版换纵向表**)——与面板纸张表(QcProcInspSheet.vue)同源:
#   公司/标题 → 抬头(单据要素 2 列组)→ 表头两行(客户名称|产品编码|型号（mm）|批号|检验人员|
#   产线常规功能性结果|结果判断 + 检验要求|检验方法)→ 明细**一行一个检验项目**(长文本 StretchHeight 自动长高)
#   → 结论区(检验结论/处理意见)+ 页脚(页码/打印时间/签署)。
#   旧的"黄底提示 + 7 固定列 + 外观/尺寸/出货重量 三组矩阵(尺寸_1..5/重量_1..5 定格参数)"版式已作废;
#   ReportService 里那套「按表区归并/摊平成定格参数」的产出与解析代码已同批删除。
#   ⚠ 解析顺序 = DB(yj_report_template) 优先 → 本注册表兜底;**落库即生效**(编译缓存按正文哈希失效)。
#     改版式要同时改 reports/qc_proc_insp.jrxml(部署源)与库内行(运行源),两者必须同源 ——
#     库内行由 `node tools/archive/_gen-qc-proc-insp-tpl-sql.mjs` 从该 .jrxml 生成迁移,别手抄。
qc_proc_insp.panelCode=QC_PROC_INSP
qc_proc_insp.name=出货检验记录表
qc_proc_insp.file=reports/qc_proc_insp.jrxml

# 组装成品检验记录表(2026-10-16,用户截图版式):检验时间|客户名称|产品编码|型号（mm）|批号|抽检总量|
#   外观|尺寸|出货重量|结果判断 —— **版式按当前明细里实际存在的检验项目动态生成**(检验项目来自出货检验
#   计划表 RD_INSP_PLAN、每个产品不一样,列不能写死),故 reports/qc_asm_insp.jrxml 是**骨架**
#   (styles + 标题 + 页脚,故意不带 columnHeader/detail);表头两行与数据行由
#   `QcAsmInspReportSupport` 按数据(表区分组/项目列/测量值格)生成后拼进骨架再编译,按列签名缓存。
#   取数:ReportService.fillQcAsmInsp(明细全量 → 矩阵 → 参数),数据源只给一行。
qc_asm_insp.panelCode=QC_ASM_INSP
qc_asm_insp.name=组装成品检验记录表
qc_asm_insp.file=reports/qc_asm_insp.jrxml

# 炭棒成型车间首件检验记录表(2026-10-17;用户口径「打印样式需要实现就是当前报表的 excel 表,
#   当前制程检验单已经存在实现」)—— 与面板纸张表(QcFirstInspSheet.vue)及其 Excel 导出**同源**:
#   公司/大标题 → 抬头四对(产品编号|产品型号|生产日期|组别)→ 两级表头(第一级=分组,跨本组各列;
#   第二级=测试项目;左上角「测试项目 ╲ 样品序号」)→ 标准行 → 1#..8# 八个样品行(每组只在自己那一对
#   样品行上有值,其余格照纸面写 `/`)→《相关要求》6 条 → 表尾(检验结果|检验人|审核人|批准)
#   (审核人 2026-10-18 补;批准 2026-11-06 首件检验单并入质量单据两级审批后补,= 超级管理员)
#   → 页脚(页码/打印时间)。
#   ⚠ **列是动态的**(面板支持新增测试项目 = 新增一列)⇒ 与组装成品检验单同一套路:
#     reports/qc_first_insp.jrxml 是**骨架**(styles + 标题/抬头 + 相关要求 + 表尾 + 页脚,
#     故意不带 columnHeader/detail);表头与样品行由 `QcFirstInspReportSupport` 按当前明细里
#     实际存在的测试项目生成后拼进骨架再编译,按列签名缓存。
#     ⚠ 参数声明也在 QcFirstInspReportSupport 的生成段里,**骨架不要写 <parameter>**
#       (两处都写 = JR 报 Duplicate declaration of parameter,整张报表编译失败,2026-11-06 实测)。
#   ⚠ 本模板**不入库** `yj_report_template`(无库内行;生效靠重新打包 jar / 重启后端)——
#     2026-11-06 核实:旧注释里提的 `_gen-first-insp-tpl-sql.mjs` 实际不存在,已订正。
qc_first_insp.panelCode=QC_FIRST_INSP
qc_first_insp.name=炭棒成型车间首件检验记录表
qc_first_insp.file=reports/qc_first_insp.jrxml

# 出厂检验报告(2026-11-01,受控表单 c-95-12 / 表单编号 YJ-QR-05/A1)—— QC_OQC_REPORT 专用表格版式。
#   背景:该面板 2026-10-30 新增,此前没有专用模板 ⇒ ReportService 回落 generic 通用模板(字段流水),
#   不是受控表单;本模板照用户提供的原件(两页扫描件见 tools/archive/_oqc-form-20261101/)复刻:
#     logo + 公司名 + 标题 + 编制日期(单据日期)→ 抬头 9 格(客户名|报告编号 / 产品名称|产品规格 /
#     生产日期|生产量 / 检测日期|AQL / 产品编码 整行)→ 主表 7 列(序号|检验项目|检验要求|抽样标准|
#     抽检量|结果|判定,表头静态、数据行逐行来自明细,检验要求/结果长文本 StretchHeight 撑高、
#     整行等高边框连续)→ 检验结论 / 备注 → 卫生安全 15 项静态表(按《生活饮用水输配水设备及防护材料
#     卫生安全评价规范》;**结果列 2026-11-01 起可填写**(qc_oqc_head.卫生_<项目> 15 个可空列;
#     纸面 QcOqcSheet 直接填、导出报表按填写值印出,空=留空,不再固定印「见型式检验报告」)
#     → 签署行(检验员=编制/审核=一级审批人/批准=二级审批人,**三格均按头字段动态落值**,空则印下划线)+
#       表单编号 YJ-QR-05/A1 → 页脚(**2026-11-04 起无地址/网址/邮箱/电话行**,只留打印时间 + 页码)。
#   取数 = ReportService 通用分支(fillReport + headParams + JRMapCollectionDataSource(detailRows)):
#     参数 = 头字段 label(中文名),数据源字段 = 明细 label;日期已是 'yyyy-MM-dd' 文本、生产数量 BigDecimal。
#     明细现状:抽样标准/抽检量是手填列(可能 NULL → 模板留空格),检验项目是计划表用语(如 *外观/*炭棒尺寸)。
#   版式备注:① A4 纵向,页边距 18pt(内容宽 559pt,列宽 = 原件 twips/20 取整);
#             ② 主表表头只在第 1 页打(与原件一致:原件表格跨页时第 2 页不重复表头);
#                明细跨页续页沿用原件口径,只重复 logo 页眉;
#             ③ 检验结论/备注/卫生安全表/签署一整套放在 group reportTail 的 groupFooter 里(跨页整块下移):
#                用 groupFooter 而不是 summary,是因为 JR 6.21 里 summary 单独起页时不打印 pageHeader(会丢 logo 页眉)。
#   **2026-11-04 用户口径(本次两处版式改动 + 模板入库)**:
#     ① 去掉红框内的页脚内容 —— 原「公司地址/网址/邮箱/电话」整行 textField 删除,打印时间/页码上移到
#        pageFooter band 顶部(y=0);band 高度保持 90(旧版带高)⇒ 整单分页不变(实测仍 1 页)。
#     ② 签署行 审核/批准 由静态下划线改为按头字段落值:审核 = $P{审核人}(一级审批人)、
#        批准 = $P{审批人}(超级管理员 / 二级通过才落值);未提交、未审批时为空 ⇒ 印下划线占位。
#        两个参数由 ReportService.headParams 按 yj_field.label 自动下发(与
#        tools/migrate-oqc-twolevel-20261104.sql 注册的 审批人/审批时间 字段配套;参数名必须与 label 一致)。
#     ③ 本模板**已入库**:yj_report_template.template_code='qc_oqc' / panel_code='QC_OQC_REPORT'
#        (迁移 tools/migrate-oqc-report-tpl-20261104.sql,由 tools/archive/_gen-oqc-tpl-sql.mjs 生成)——
#        解析走「DB 优先」,模板管理里可见,不再有「没设定时回落通用格式」的窗口。
#        ⚠ 改版式的唯一正确姿势:改 reports/qc_oqc.jrxml → 重跑 `node tools/archive/_gen-oqc-tpl-sql.mjs`
#        → 两账套执行生成的迁移(DbSync run);别手抄、别手改库内行(库内 XML 与 .jrxml 必须同源)。
#        本文件下面三行注册表保留作「新装库 / DB 行被删」时的兜底。
qc_oqc.panelCode=QC_OQC_REPORT
qc_oqc.name=出厂检验报告
qc_oqc.file=reports/qc_oqc.jrxml

