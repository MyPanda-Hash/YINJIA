# ============================================================================
# 报表模板注册表(IT 维护)  —— 业务在面板上「导出报表」时能选的模板就是这里的行
# ----------------------------------------------------------------------------
# 一行三键,<模板编码> 自己起(小写字母/下划线,作为接口的 code 参数):
#   <code>.panelCode = 面板编码(必须是 yj_panel.panel_code,取数走该面板的既有查询链路)
#   <code>.name      = 报表名(前端下拉里显示给业务看的名字)
#   <code>.file      = 模板文件(classpath 路径,放 backend/src/main/resources/reports/ 下即可)
#
# 新增一张单据的报表(第二期铺开的做法):
#   1) 拷一份 reports/so_order.jrxml 改成新单的字段,放同目录;
#   2) 在下面加三行;
#   3) 重启后端 —— 前端不用改(入口按「该面板有没有模板」自动显隐)。
# 模板里的字段/参数中文名必须与 yj_field.label 一致,否则取不到值(取数见 ReportService)。
# ============================================================================

so_order.panelCode=SO_ORDER
so_order.name=销售订单
so_order.file=reports/so_order.jrxml

sl_recv.panelCode=SL_RECV
sl_recv.name=送料暂收单
sl_recv.file=reports/sl_recv.jrxml

# 出厂检验报告(2026-10-12):按公司受控表单 c-95-12(表单编号 YJ-QR-05/A1)做的版式,
# 首次挂在销售出库单上。取数口径见 ReportService.headParams + detailRows。
prod_insp.panelCode=SALE_OUT
prod_insp.name=出厂检验报告
prod_insp.file=reports/prod_insp.jrxml

# 制程检验记录表(2026-10-12):按用户截图「制程检验」页签做——
# 上半部=制程检验组(黄底提示 + 7 固定列 + 外观/尺寸/出货重量 三组矩阵),
# 下半部=出货检验功能性测试组(检验要求 / 检验方法,逐行渲染)。
# 三个矩阵格的数据由 ReportService.headParams 按明细「表区」归并后下发。
qc_proc_insp.panelCode=QC_PROC_INSP
qc_proc_insp.name=制程检验记录表
qc_proc_insp.file=reports/qc_proc_insp.jrxml


