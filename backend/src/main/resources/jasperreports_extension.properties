# ============================================================================
# YINJIA-MES 报表字体扩展注册表(部署层,IT 维护)
# ----------------------------------------------------------------------------
# JasperReports 启动时扫描 classpath 根下的本文件,按下面的键注册字体族;
# 报表模板里 <style fontName="NotoSansSC"> 引用的就是这里注册的族名。
#
# 为什么必须有它:PDF 要显示中文,字体必须【嵌入】。Java 自带的逻辑字体
# (Serif/SansSerif)不嵌入,PDF 里中文会变方框;而字体扩展是唯一让
# JasperReports 把 TTF 嵌入 PDF 的官方做法。
#
# 为什么是 TTF 而不是 OTF:JasperReports 的 PDF 导出走 OpenPDF,只认 TrueType(glyf)
# 轮廓;.otf/.ttc(CFF 轮廓)支持极差,实测出方框。本目录下两份 TTF 都是
# TrueType 轮廓(--> 用 fontTools 从 Noto Sans SC 可变字体 instance 出来的静态字重)。
#
# 换字体的正确姿势:
#   1) 放新的 *.ttf 到 fonts/ 下(TTF!不要 OTF/TTC);
#   2) 改 fonts/noto-sans-sc.xml 里的 4 个字形路径;
#   3) 报表模板里的 fontName 保持不变即可(族名不变就不用动模板)。
# ----------------------------------------------------------------------------
net.sf.jasperreports.extension.registry.factory.fonts=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory

# 中文字体族(报表唯一字体)
net.sf.jasperreports.extension.simple.font.families.notosanssc=fonts/noto-sans-sc.xml
