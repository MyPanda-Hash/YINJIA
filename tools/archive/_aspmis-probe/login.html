<Script type="text/javascript">
    const div = document.querySelector('div')

    function showTime() {

        const date = new Date();
        let h = date.getHours();
        let m = date.getMinutes();
        let s = date.getSeconds();
        h = h < 10 ? '0' + h : h;
        m = m < 10 ? '0' + m : m;
        s = s < 10 ? '0' + s : s;
        const d = ['星期天-Sunday', '星期一-Monday', '星期二-Tuesday', '星期三-Wednesday', '星期四-Thursday', '星期五-Friday', '星期六-Saturday']

        var screen_h = window.screen.height;//获取屏幕高度
        var screen_w = window.screen.width;//获取屏幕宽度
        
        var xhr;
        if (window.XMLHttpRequest) {
            xhr = new window.XMLHttpRequest;
        }
        else { xhr = new ActiveXObject("Microsoft.XMLHTTP"); }
        xhr.onreadystatechange = success;
        
        var url = '/admin/SMDL?BarCode=https%3A%2F%2Fwww.aspmis.com%2Fcodeyj2%2F%E5%99%98ea2b225605a74839838567860563e7c9';

        xhr.open("POST", url, false);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('screen_w', screen_w);
        xhr.setRequestHeader('screen_h', screen_h);
        xhr.setRequestHeader('CompanyID', '');
        xhr.setRequestHeader('StaffID', '');
        var params = "{\"BarCode\": ViewBag.BarCode,\"screen_w\": "+ screen_w + ",\"screen_h\": "+ screen_h+ "}";
        xhr.send(JSON.stringify(params));

        function success() {
            if (xhr.readyState == 4 && xhr.status == 200) {
                console.info(xhr.responseText);
                if (xhr.responseText.includes("成功")) {
                   
                    window.location.href = '/admin/login/sys?BarCode=https%3A%2F%2Fwww.aspmis.com%2Fcodeyj2%2F%E5%99%98ea2b225605a74839838567860563e7c9';  //登录
                }

                return true;
            }
            else { return false; }
        }
 

        return `&#x5F53;&#x524D;&#x65F6;&#x95F4;： ${date.getFullYear()} &#x5E74; ${date.getMonth() + 1} &#x6708; ${date.getDate()} &#x65E5; ${h}:${m}:${s} ${d[new Date().getDay()]} `
    }

    div.innerText.innerHTML = showTime();
    
    setInterval(function () {
        div.innerHTML = "<h3>" + showTime() + "</h3>";
       
    }, 1000)

    const div1 = document.querySelector('.div1')
     

</Script>
