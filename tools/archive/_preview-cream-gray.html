<!DOCTYPE html>
<!--
  _preview-cream-gray.html — 「粉色 → 奶油灰」配色对比样张(仅用于目视核对)
  左=改前(粉 #f9dfe2 / 说明段 #fdeef0),右=改后(奶油灰 #ECEAE3 / #F5F3EE)。
  结构复刻纸张区块条的真实版式(边框 #7f7f7f、正文 #333、14px 700 居中)。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>区块条配色对比:粉 → 奶油灰</title>
<style>
  body { margin: 0; padding: 20px; background: #f0f2f5; font: 13px/1.5 "Microsoft YaHei", sans-serif; color: #333; }
  .row { display: flex; gap: 22px; align-items: flex-start; }
  .col { width: 470px; }
  .cap { font-weight: 700; margin-bottom: 6px; }
  .cap.old { color: #a4565f; }
  .cap.new { color: #5c6b52; }
  table { border-collapse: collapse; width: 100%; background: #fff; table-layout: fixed; }
  td { border: 1px solid #7f7f7f; padding: 5px 10px; font-size: 12.5px; }
  .bar { font-size: 14px; font-weight: 700; text-align: center; padding: 5px 10px; color: #333; }
  .bar.old { background: #f9dfe2; }
  .bar.new { background: #ECEAE3; }
  .principle { padding: 6px 14px; font-size: 12.5px; line-height: 1.6; border: 1px solid #8a8a8a; }
  .principle.old { background: #fdeef0; color: #6b3a3a; }
  .principle.new { background: #F5F3EE; color: #4A4642; }
  .sw { display: flex; gap: 10px; margin-top: 16px; }
  .sw div { width: 150px; height: 54px; border: 1px solid #c9ced6; display: flex; align-items: flex-end; justify-content: center; font-size: 11px; color: #555; padding-bottom: 3px; }
</style>
</head>
<body>
<div class="row">
  <div class="col">
    <div class="cap old">改前(粉)</div>
    <table>
      <tr><td class="bar old" colspan="2">一、产品基本信息</td></tr>
      <tr><td style="width:130px;background:#d9d9d9;text-align:center">产品编号</td><td>C-95-33</td></tr>
      <tr><td class="bar old" colspan="2">二、规格与尺寸</td></tr>
      <tr><td style="background:#d9d9d9;text-align:center">炭棒尺寸</td><td>内径 / 外径 / 长度</td></tr>
    </table>
    <div class="principle old" style="margin-top:12px">
      项目定级原则:1. 二级项目=形成B级客户或该产品一年内有望给经济收益……(说明段)
    </div>
  </div>

  <div class="col">
    <div class="cap new">改后(奶油灰)</div>
    <table>
      <tr><td class="bar new" colspan="2">一、产品基本信息</td></tr>
      <tr><td style="width:130px;background:#d9d9d9;text-align:center">产品编号</td><td>C-95-33</td></tr>
      <tr><td class="bar new" colspan="2">二、规格与尺寸</td></tr>
      <tr><td style="background:#d9d9d9;text-align:center">炭棒尺寸</td><td>内径 / 外径 / 长度</td></tr>
    </table>
    <div class="principle new" style="margin-top:12px">
      项目定级原则:1. 二级项目=形成B级客户或该产品一年内有望给经济收益……(说明段)
    </div>
  </div>
</div>

<div class="sw">
  <div style="background:#f9dfe2">旧 区块条 #f9dfe2</div>
  <div style="background:#fdeef0">旧 说明段 #fdeef0</div>
  <div style="background:#ECEAE3">新 区块条 #ECEAE3</div>
  <div style="background:#F5F3EE">新 说明段 #F5F3EE</div>
  <div style="background:#ffffff">纸张白 #ffffff</div>
</div>
</body>
</html>
